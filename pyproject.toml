[project]
name = "effort-benchmark"
version = "0.1.0"
description = "Empirical measurement framework for Claude Code --effort parameter"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Phase 1: stdlib only (json, pathlib, dataclasses).
    # Phase 2 dependencies:
    # "pandas>=2.2",
    # "matplotlib>=3.9",
    # "plotly>=5.24",
    # "scipy>=1.14",
    # "openai>=1.50",
    # "google-generativeai>=0.8",
    # "anthropic>=0.40",
    # "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runner"]

[tool.ruff]
line-length = 100
target-version = "py311"
